
apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-food-blue
  labels:
    app: online-food-ordering
    color: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: online-food-ordering
      color: blue
  template:
    metadata:
      labels:
        app: online-food-ordering
        color: blue
    spec:
      containers:
        - name: food-web
          image: mahevit/online-food-ordering:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-food-green
  labels:
    app: online-food-ordering
    color: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: online-food-ordering
      color: green
  template:
    metadata:
      labels:
        app: online-food-ordering
        color: green
    spec:
      containers:
        - name: food-web
          image: mahevit/online-food-ordering:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: online-food-service
spec:
  type: NodePort
  selector:
    app: online-food-ordering
    color: blue
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082
